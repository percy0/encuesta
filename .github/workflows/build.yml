name: Compilar a EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install selenium pyinstaller

    - name: Generar ejecutable con PyInstaller (Con recoleccion de Selenium)
      run: |
        pyinstaller --onefile --console --collect-all selenium main.py

    - name: Subir archivo EXE como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: program-exe
        path: dist/*.exe
